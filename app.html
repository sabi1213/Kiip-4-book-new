<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d47a1">
  <meta name="description" content="Sabbir-এর বড় ও সহজে পড়ার KIIP Level 4 বাংলা-কোরিয়ান অধ্যয়ন অ্যাপ।">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>Sabbir Korean — অধ্যায় ধরে শিখি</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;color:#17324d;background:#f1f6fc}body{display:flex;flex-direction:column;min-height:100dvh}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px clamp(12px,2vw,24px);background:#fff;box-shadow:0 3px 18px #17324d12;z-index:2;flex-shrink:0}.brand{display:flex;align-items:center;gap:9px}.mark{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,#0d47a1,#42a5f5);color:white;font-weight:900;font-size:17px}.title{font-weight:800;font-size:15px}.subtitle{font-size:11px;color:#62788d}.actions{display:flex;gap:7px;align-items:center}.actions a,.actions button{border:0;border-radius:22px;padding:9px 13px;text-decoration:none;background:#e8f1ff;color:#0d47a1;font-weight:700;font-size:13px;cursor:pointer}.actions .primary{background:#0d47a1;color:#fff}.intro{padding:9px clamp(12px,2vw,24px);display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(110deg,#e7f2ff,#f7faff);border-bottom:1px solid #dfeaf6;flex-shrink:0}.intro h1{font-size:clamp(17px,2.2vw,23px);margin:0 0 1px;color:#123c79}.intro p{margin:0;color:#526b83;font-size:13px}.badge{padding:6px 11px;border-radius:20px;background:#fff;color:#0d47a1;font-weight:700;font-size:12px;white-space:nowrap;box-shadow:0 2px 9px #0d47a114}main{flex:1;min-height:0;padding:7px clamp(6px,1vw,12px) 9px;display:flex}.frame-shell{flex:1;height:100%;min-height:0;background:#fff;border:1px solid #dce6f1;border-radius:12px;overflow:hidden;box-shadow:0 8px 28px #17324d10}iframe{display:block;width:100%;height:100%;min-height:0;border:0;background:#f3f6fb}.footer{text-align:center;padding:2px 10px 5px;color:#75879a;font-size:10px;flex-shrink:0}.frame-shell:fullscreen{width:100vw;height:100vh;min-height:100vh;border:0;border-radius:0;box-shadow:none;background:#f3f6fb}.frame-shell:fullscreen iframe{height:100vh}.frame-shell:-webkit-full-screen{width:100vw;height:100vh;min-height:100vh;border:0;border-radius:0;box-shadow:none}.frame-shell:-webkit-full-screen iframe{height:100vh}@media(max-width:620px){.bar{padding:6px 9px}.mark{width:32px;height:32px}.title{font-size:13px}.subtitle{font-size:10px}.actions{gap:4px}.actions a,.actions button{padding:8px 9px;font-size:11px}.intro{padding:7px 10px}.intro h1{font-size:17px}.intro p{font-size:11px}.badge{font-size:10px;padding:5px 7px}main{padding:4px}.frame-shell{border-radius:8px}.footer{display:none}}
  </style>
</head>
<body>
  <header class="bar"><div class="brand"><div class="mark" aria-hidden="true">S</div><div><div class="title">Sabbir Korean</div><div class="subtitle">বিসমিল্লাহির রাহমানির রাহিম · সহজে শিখি</div></div></div><div class="actions"><a href="./">হোম</a><button id="fontButton" type="button" aria-pressed="false">লেখা বড়</button><button class="primary" id="screenButton" type="button" aria-label="পূর্ণ পর্দায় দেখুন">পূর্ণ পর্দা</button></div></header>
  <section class="intro"><div><h1>অধ্যায় ধরে কোরিয়ান শিখি</h1><p>অধ্যায় বেছে নিন, শব্দ শিখুন, লিখুন ও নিজের অগ্রগতি ধরে রাখুন।</p></div><span class="badge">📘 KIIP 4급 · ১৬ অধ্যায়</span></section>
  <main><div class="frame-shell" id="frameShell"><iframe id="studyFrame" title="KIIP কোরিয়ান অধ্যায় ও লিখিত অনুশীলন" src="./practice.html"></iframe></div></main>
  <footer class="footer">Sabbir-এর বাংলা-কোরিয়ান অধ্যয়ন সহায়ক</footer>
  <script>
    const frame=document.getElementById('studyFrame'),fontButton=document.getElementById('fontButton'),screenButton=document.getElementById('screenButton'),frameShell=document.getElementById('frameShell');let enlarged=false;
    function styleStudyPage(){try{const doc=frame.contentDocument;if(!doc||!doc.head)return;let style=doc.getElementById('sabbir-readable-style');if(!style){style=doc.createElement('style');style.id='sabbir-readable-style';doc.head.appendChild(style)}style.textContent='html{font-size:19px!important}body{font-size:19px!important;line-height:1.8!important}.wrap{width:min(1120px,96%)!important}.card{padding:clamp(16px,3vw,28px)!important;border-radius:16px!important}.nav{gap:9px!important}.chapter{padding:12px 17px!important;min-height:48px!important;font-size:16px!important}.nav a,.nav button,.chapter{font-size:16px!important}button,input,textarea{font:inherit!important}button{min-height:44px!important}textarea{min-height:150px!important;width:100%!important}h1{font-size:clamp(25px,4vw,40px)!important}h2{font-size:clamp(22px,3vw,30px)!important}@media(max-width:600px){html,body{font-size:18px!important}.nav{overflow-x:auto!important;flex-wrap:nowrap!important}.nav button,.nav a{white-space:nowrap!important;font-size:15px!important}.chapter{font-size:15px!important}}'+(enlarged?'html,body{font-size:22px!important}.chapter,.nav button,.nav a{font-size:19px!important}textarea{font-size:21px!important}':'')}catch(_){}}
    frame.addEventListener('load',styleStudyPage);fontButton.addEventListener('click',()=>{enlarged=!enlarged;fontButton.setAttribute('aria-pressed',String(enlarged));fontButton.textContent=enlarged?'স্বাভাবিক লেখা':'লেখা বড়';styleStudyPage()});
    screenButton.addEventListener('click',async()=>{try{if(!document.fullscreenElement){if(frameShell.requestFullscreen)await frameShell.requestFullscreen();else if(frameShell.webkitRequestFullscreen)frameShell.webkitRequestFullscreen();}else if(document.exitFullscreen)await document.exitFullscreen();}catch(_){screenButton.textContent='ফুল স্ক্রিন সমর্থিত নয়';setTimeout(()=>screenButton.textContent='পূর্ণ পর্দা',2200)}});
    document.addEventListener('fullscreenchange',()=>{screenButton.textContent=document.fullscreenElement?'ফুল স্ক্রিন বন্ধ করুন':'পূর্ণ পর্দা';if(frame.contentWindow)frame.contentWindow.dispatchEvent(new Event('resize'))});
    if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
  </script>
</body>
</html>
