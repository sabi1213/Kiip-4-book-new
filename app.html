<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d47a1">
  <meta name="description" content="KIIP Level 4 বাংলা-কোরিয়ান অধ্যয়ন গাইড">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>KIIP 4급 Study App</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#f3f6fb;color:#183153}body{display:flex;flex-direction:column}.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:#0d47a1;color:#fff;box-shadow:0 2px 8px #0002}.brand{font-weight:700}.tagline{font-size:12px;color:#dbeafe}.actions{display:flex;gap:8px;align-items:center}.app-link,.install{border:0;border-radius:20px;padding:10px 14px;background:#ffeb3b;color:#17324d;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}.install[hidden]{display:none}main{flex:1;min-height:0}iframe{display:block;width:100%;height:100%;border:0;background:#f3f6fb}.notice{padding:8px 14px;text-align:center;background:#fff8db;color:#674d00;font-size:13px}@media(max-width:520px){.appbar{align-items:flex-start}.actions{flex-direction:column;align-items:stretch}.app-link,.install{padding:8px 10px;font-size:12px}}
  </style>
</head>
<body>
  <header class="appbar"><div><div class="brand">KIIP 4급 Study App</div><div class="tagline">১৬ অধ্যায়ের বাংলা-কোরিয়ান গাইড</div></div><div class="actions"><a class="app-link" href="./practice.html">লিখিত অনুশীলন</a><button id="installButton" class="install" hidden>অ্যাপ ইনস্টল</button></div></header>
  <div id="installNotice" class="notice" hidden>iPhone/iPad-এ Share মেনু থেকে “Add to Home Screen” নির্বাচন করুন।</div>
  <main><iframe title="KIIP Level 4 study guide" src="./index.html"></iframe></main>
  <script>
    let installPrompt;const installButton=document.getElementById('installButton'),installNotice=document.getElementById('installNotice');
    window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;installButton.hidden=false});
    installButton.addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installButton.hidden=true});
    window.addEventListener('appinstalled',()=>{installButton.hidden=true});
    const isAppleMobile=/iphone|ipad|ipod/i.test(navigator.userAgent),isStandalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone;if(isAppleMobile&&!isStandalone)installNotice.hidden=false;
    if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(error=>console.error('Service worker registration failed:',error)));
  </script>
</body>
</html>
