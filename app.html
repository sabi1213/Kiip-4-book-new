<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>KIIP Level 4 Korean Study &amp; Smart Dictionary</title><style>body{margin:0;background:#020617;color:#e2e8f0;font:16px system-ui,sans-serif}.restore-status{max-width:620px;margin:12vh auto;padding:24px;border:1px solid #334155;border-radius:20px;background:#0f172a;text-align:center}.restore-status h1{color:#facc15;font-size:1.3rem}.restore-status p{line-height:1.7}.restore-status button{padding:10px 16px;border:0;border-radius:10px;background:#facc15;font-weight:700}</style></head><body><main class="restore-status" id="restore-status"><h1>KIIP অ্যাপ লোড হচ্ছে…</h1><p>আগের অধ্যায়, vocabulary, quiz, writing ও অন্যান্য feature অক্ষত রেখেই নতুন Dictionary, audio ও exam writing খোলা হচ্ছে।</p></main><script>(async()=>{const status=document.getElementById('restore-status');const previousApp='https://raw.githubusercontent.com/sabi1213/Kiip-4-book-new/af31a52e1f1a8ff53e26c0bca5e55236fd55522d/app.html';try{const response=await fetch(previousApp,{cache:'no-store'});if(!response.ok)throw new Error();let html=await response.text();if(!html.includes('gemini-dictionary.js'))html=html.replace(/<\/body>/i,'<script src="./site-brand.js?v=27"><\/script><script src="./gemini-dictionary.js?v=27"><\/script></body>');else html=html.replace(/gemini-dictionary\.js(?:\?v=\d+)?/,'gemini-dictionary.js?v=27');document.open();document.write(html);document.close()}catch(_){status.innerHTML='<h1>অ্যাপ লোড করা যায়নি</h1><p>Internet connection যাচাই করে refresh করুন।</p><button onclick="location.reload()">আবার চেষ্টা করুন</button>'}})();</script></body></html>
