{ko:'현대인의 질병',bn:'আধুনিক মানুষের রোগব্যাধি',en:'Modern diseases',note:'কম চলাফেরা, মানসিক চাপ ও অনিয়মিত অভ্যাস স্বাস্থ্যে প্রভাব ফেলতে পারে। নিয়মিত ঘুম, সুষম খাবার, শরীরচর্চা ও প্রয়োজন হলে চিকিৎসকের পরামর্শ প্রতিরোধে সহায়ক।',words:[['질병','jilbyeong','রোগ','disease'],['증상','jeungsang','উপসর্গ','symptom'],['예방하다','yebanghada','প্রতিরোধ করা','to prevent'],['건강 검진','geongang geomjin','স্বাস্থ্য পরীক্ষা','health checkup'],['스트레스','seuteureseu','মানসিক চাপ','stress']],quiz:['স্বাস্থ্য রক্ষার উপযোগী অভ্যাস কোনটি?',['নিয়মিত ব্যায়াম ও পর্যাপ্ত ঘুম','উপসর্গ লুকানো','নিজে নিজে ওষুধ নেওয়া'],0],prompt:'সুস্থ থাকার জন্য আপনি কী কী অভ্যাস করেন?',model:'건강을 지키려면 좋은 생활 습관이 필요합니다. 저는 규칙적으로 식사하고 물을 충분히 마시려고 합니다. 시간이 있을 때 걷거나 운동하면 몸과 마음에 도움이 됩니다. 잠을 충분히 자고 스트레스를 줄이는 것도 중요합니다. 증상이 오래 계속되면 병원에 가서 의사의 진료를 받아야 합니다. 정기적인 건강 검진과 예방 습관으로 건강한 생활을 할 수 있습니다.'},
{ko:'정보화 사회',bn:'তথ্যপ্রযুক্তিনির্ভর সমাজ',en:'Information society',note:'ডিজিটাল সেবা কাজ দ্রুত করে, তবে তথ্যের সত্যতা, ব্যক্তিগত তথ্যের নিরাপত্তা ও অনলাইন শিষ্টাচার গুরুত্বপূর্ণ। সন্দেহজনক লিংক বা অজানা ব্যক্তির কাছে ব্যক্তিগত তথ্য দেবেন না।',words:[['정보화 사회','jeongbohwa sahoe','তথ্যসমাজ','information society'],['개인 정보','gaein jeongbo','ব্যক্তিগত তথ্য','personal information'],['인터넷','inteonet','ইন্টারনেট','internet'],['검색하다','geomsaekhada','খোঁজা','to search'],['보안','boan','নিরাপত্তা','security']],quiz:['অনলাইনে ব্যক্তিগত তথ্য রক্ষায় কী করবেন?',['পাসওয়ার্ড গোপন রাখবেন','সবার সঙ্গে শেয়ার করবেন','অজানা লিংকে তথ্য দেবেন'],0],prompt:'তথ্যপ্রযুক্তির সুবিধা ও নিরাপদ ব্যবহারের নিয়ম লিখুন।',model:'정보화 사회에서는 인터넷으로 많은 일을 빠르게 할 수 있습니다. 필요한 정보를 검색하고 온라인으로 공부하거나 신청할 수 있습니다. 하지만 모든 정보가 정확한 것은 아니므로 출처를 확인해야 합니다. 비밀번호와 개인정보를 다른 사람에게 알려 주지 않는 것도 중요합니다. 의심스러운 링크는 누르지 말아야 합니다. 인터넷을 바르고 안전하게 사용하면 생활에 큰 도움이 됩니다.'},
{ko:'사건과 사고',bn:'ঘটনা ও দুর্ঘটনা',en:'Incidents and accidents',note:'জরুরি ঘটনায় আগে নিজের ও অন্যের নিরাপত্তা নিশ্চিত করুন, বিপদস্থল থেকে নিরাপদ স্থানে যান এবং যথাযথ জরুরি সেবায় যোগাযোগ করুন। প্রত্যক্ষ তথ্য দিন, গুজব ছড়াবেন না।',words:[['사건','sageon','ঘটনা/মামলা','incident'],['사고','sago','দুর্ঘটনা','accident'],['신고하다','singohada','জানানো/রিপোর্ট করা','to report'],['목격자','mokgyeokja','প্রত্যক্ষদর্শী','witness'],['안전 수칙','anjeon suchik','নিরাপত্তা বিধি','safety rule']],quiz:['দুর্ঘটনা দেখলে প্রথমে কী করা উচিত?',['নিরাপদ থাকা ও জরুরি সাহায্য চাওয়া','ভিডিও করতে কাছে যাওয়া','গুজব পোস্ট করা'],0],prompt:'দুর্ঘটনা এড়াতে কী কী সতর্কতা নেওয়া দরকার?',model:'사고를 예방하려면 평소에 안전 수칙을 지켜야 합니다. 길을 건널 때는 신호를 확인하고 운전할 때는 안전벨트를 매야 합니다. 사고를 목격하면 먼저 안전한 곳으로 이동합니다. 다친 사람이 있으면 긴급 기관에 신고하고 정확한 위치와 상황을 알려 줍니다. 확인되지 않은 소문이나 사진을 인터넷에 올리지 않습니다. 침착하고 책임 있게 행동하는 것이 중요합니다.'},
{ko:'언어생활',bn:'ভাষার ব্যবহার',en:'Language in daily life',note:'কথার ধরন পরিস্থিতি, সম্পর্ক ও শ্রোতার ওপর নির্ভর করে। সম্মানসূচক ভাষা ব্যবহার, মনোযোগ দিয়ে শোনা এবং পরিষ্কারভাবে প্রশ্ন করা কার্যকর যোগাযোগের অংশ।',words:[['언어생활','eoneosaenghwal','ভাষার ব্যবহার','language use'],['존댓말','jondaenmal','সম্মানসূচক ভাষা','honorific speech'],['표현','pyohyeon','প্রকাশভঙ্গি','expression'],['대화하다','daehwahada','কথোপকথন করা','to converse'],['의사소통','uisasotong','যোগাযোগ','communication']],quiz:['বয়োজ্যেষ্ঠ বা অপরিচিত ব্যক্তির সঙ্গে সাধারণত কী ব্যবহার করা হয়?',['সম্মানসূচক ভাষা','অশালীন শব্দ','কোনো উত্তর নয়'],0],prompt:'ভদ্র ও পরিষ্কার যোগাযোগের গুরুত্ব লিখুন।',model:'언어는 사람들과 생각을 나누는 중요한 도구입니다. 한국어를 사용할 때는 상대방과 상황에 맞는 표현을 선택해야 합니다. 어른이나 처음 만나는 사람에게는 존댓말을 사용하는 것이 예의입니다. 대화할 때 상대방의 말을 잘 듣고 모르는 표현은 정중하게 물어봅니다. 실수해도 계속 연습하면 더 자연스럽게 말할 수 있습니다. 서로 존중하는 언어생활은 좋은 관계를 만드는 데 도움이 됩니다.'},
{ko:'교육 제도',bn:'শিক্ষাব্যবস্থা',en:'Education system',note:'শিক্ষাব্যবস্থা জ্ঞান, দক্ষতা ও সামাজিক অংশগ্রহণের সুযোগ দেয়। শিক্ষার্থী, পরিবার ও শিক্ষকের সহযোগিতা এবং নিয়মিত অধ্যয়ন শেখার অগ্রগতিতে সহায়তা করে।',words:[['교육 제도','gyoyuk jedo','শিক্ষাব্যবস্থা','education system'],['학교','hakgyo','বিদ্যালয়','school'],['수업','sueop','ক্লাস','class'],['졸업하다','joreophada','স্নাতক/পাস করা','to graduate'],['평생 교육','pyeongsaeng gyoyuk','আজীবন শিক্ষা','lifelong learning']],quiz:['পড়াশোনায় অগ্রগতির জন্য কোনটি সহায়ক?',['নিয়মিত অধ্যয়ন','ক্লাস এড়িয়ে চলা','প্রশ্ন না করা'],0],prompt:'শিক্ষা মানুষের জীবনে কেন গুরুত্বপূর্ণ?',model:'교육은 지식과 기술을 배우고 미래를 준비하는 데 중요합니다. 학생은 학교에서 여러 과목을 공부하고 친구들과 협력하는 방법도 배웁니다. 사람마다 배우는 속도와 목표가 다를 수 있습니다. 그래서 꾸준히 공부하고 모르는 점을 선생님에게 질문하는 태도가 필요합니다. 학교를 졸업한 뒤에도 새로운 것을 배우면 일과 생활에 도움이 됩니다. 교육은 개인과 사회를 함께 성장시킵니다.'},

const list=document.getElementById('chapterList'),lesson=document.getElementById('lesson'),search=document.getElementById('search');let current=0,activeTab='notes';
function renderList(filter=''){const q=filter.trim().toLowerCase();list.innerHTML='';chapters.forEach((c,i)=>{if(q&&!(`${c.ko} ${c.bn} ${c.en}`).toLowerCase().includes(q))return;const b=document.createElement('button');b.className='chapter-btn'+(i===current?' active':'');b.innerHTML=`<span class="chapter-no">${String(i+1).padStart(2,'0')}</span><span>${c.ko}<br><small>${c.bn}</small></span>`;b.onclick=()=>{current=i;activeTab='notes';location.hash=`chapter-${i+1}`;renderList(search.value);renderLesson()};list.appendChild(b)});if(!list.children.length)list.innerHTML='<div class="empty">কোনো অধ্যায় পাওয়া যায়নি।</div>'}
function renderLesson(){const c=chapters[current];const tabs=[['notes','Study notes'],['vocab','শব্দভাণ্ডার'],['quiz','Quiz'],['writing','লিখিত প্রস্তুতি']];let body='';if(activeTab==='notes')body=`<h3 class="section-title">Study notes · অধ্যায়ের মূল ধারণা</h3><div class="note-grid"><article class="note"><h3>বাংলা ব্যাখ্যা</h3><p>${c.note}</p></article><article class="note"><h3>English summary</h3><p>${c.en}. Learn the key idea, notice how it appears in everyday life, and use the vocabulary below to explain your own experience. These are original study notes, not a verbatim textbook reproduction.</p></article><article class="note"><h3>핵심 표현</h3><p>${c.ko} · ${c.bn}. বিষয়টি নিজের জীবনের উদাহরণ দিয়ে ব্যাখ্যা করুন এবং প্রয়োজনীয় Korean শব্দ অনুশীলন করুন।</p></article><article class="note"><h3>Study tip</h3><p>শব্দগুলো জোরে পড়ুন, নিজের একটি উদাহরণ লিখুন, তারপর নিচের quiz দিন। Read, recall, and write one personal example.</p></article></div>`;if(activeTab==='vocab')body=`<h3 class="section-title">Vocabulary · শব্দভাণ্ডার</h3><div class="vocab-wrap"><table class="vocab"><thead><tr><th>한국어</th><th>পড়ার সহায়তা</th><th>বাংলা অর্থ</th><th>English</th></tr></thead><tbody>${c.words.map(w=>`<tr><td lang="ko"><strong>${w[0]}</strong></td><td>${w[1]}</td><td>${w[2]}</td><td>${w[3]}</td></tr>`).join('')}</tbody></table></div>`;if(activeTab==='quiz')body=`<h3 class="section-title">Exam-style practice · অনুশীলনী</h3><p class="muted">এটি শেখার জন্য তৈরি অনুশীলনী—অফিসিয়াল KIIP পরীক্ষার প্রশ্ন নয়।</p><div class="quiz-question"><strong>${c.quiz[0]}</strong><div class="options">${c.quiz[1].map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}"><span>${o}</span></label>`).join('')}</div></div><button class="check" id="checkAnswer">উত্তর যাচাই করুন</button><div class="feedback" id="feedback" aria-live="polite"></div>`;if(activeTab==='writing')body=`<h3 class="section-title">Writing practice · লিখিত প্রস্তুতি</h3><p><strong>Prompt:</strong> ${c.prompt}</p><p class="muted">প্রায় 100 Korean words/단어 লক্ষ্য রাখুন। Model answer-টি কাঠামো বোঝার জন্য; নিজের অভিজ্ঞতা দিয়ে লিখুন।</p><h4>মডেল অ্যানসার · Model answer</h4><div class="model" lang="ko">${c.model}</div><div class="row"><strong>আপনার উত্তর</strong><span class="muted" id="wordCount">0 Korean eojeol / শব্দ</span></div><textarea class="textarea" id="answerBox" placeholder="এখানে Korean বা বাংলা draft লিখুন…" aria-label="নিজের লিখিত উত্তর"></textarea><div class="row"><span class="muted" id="savedStatus">এই ডিভাইসে স্বয়ংক্রিয়ভাবে সেভ হবে।</span><button class="save" id="saveAnswer">এখন সেভ করুন</button></div>`;lesson.innerHTML=`<article class="content-card"><div class="chapter-heading"><div><span class="pill">অধ্যায় ${String(current+1).padStart(2,'0')} · Chapter ${current+1} of 16</span><h2>${c.ko}</h2><p class="bn-title">${c.bn} · ${c.en}</p></div></div><div class="tabs">${tabs.map(t=>`<button class="tab ${activeTab===t[0]?'active':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>${body}</article>`;lesson.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;renderLesson()});if(activeTab==='quiz')document.getElementById('checkAnswer').onclick=()=>{const chosen=lesson.querySelector('input[name="answer"]:checked'),f=document.getElementById('feedback');f.textContent=!chosen?'একটি উত্তর বেছে নিন।':Number(chosen.value)===c.quiz[2]?'সঠিক উত্তর! ভালো করেছেন।':'আবার চেষ্টা করুন—অধ্যায়ের নোট দেখুন।';f.style.color=chosen&&Number(chosen.value)===c.quiz[2]?'#16804a':'#a44b13'};if(activeTab==='writing'){const box=document.getElementById('answerBox'),key=`kiip-writing-${current}`;try{box.value=localStorage.getItem(key)||''}catch(_){}const count=()=>{const n=box.value.trim()?box.value.trim().split(/\s+/u).length:0;document.getElementById('wordCount').textContent=`${n} Korean eojeol / শব্দ`};count();box.addEventListener('input',()=>{count();try{localStorage.setItem(key,box.value);document.getElementById('savedStatus').textContent='এই ডিভাইসে সেভ হয়েছে।'}catch(_){document.getElementById('savedStatus').textContent='Auto-save unavailable; সেভ বাটন চেষ্টা করুন।'}});document.getElementById('saveAnswer').onclick=()=>{try{localStorage.setItem(key,box.value);document.getElementById('savedStatus').textContent='উত্তর এই ডিভাইসে সেভ হয়েছে।'}catch(_){document.getElementById('savedStatus').textContent='সেভ করা যায়নি।'}}}}
function openHash(){const m=location.hash.match(/chapter-(\d+)/);if(m){current=Math.min(15,Math.max(0,Number(m[1])-1));renderList(search.value);renderLesson()}}search.addEventListener('input',()=>renderList(search.value));window.addEventListener('hashchange',openHash);renderList();openHash();if(!location.hash)renderLesson();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script></body></html>
