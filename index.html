<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KIIP 4급 - সম্পূর্ণ বই</title>
  <style>
    :root{
      --primary:#0d47a1;
      --primary-dark:#09306f;
      --secondary:#1565c0;
      --accent:#ffeb3b;
      --danger:#d32f2f;
      --bg:#f4f7fb;
      --card:#ffffff;
      --soft-blue:#edf5ff;
      --soft-yellow:#fff8db;
      --border:#dfeaf7;
      --text:#1f2937;
      --muted:#5b6473;
      --success:#2e7d32;
    }

    * { box-sizing:border-box; margin:0; padding:0; }
    html { scroll-behavior:smooth; }
    body{
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height:1.7;
    }

    .topbar{
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color:white;
      text-align:center;
      padding:28px 20px 18px;
      box-shadow:0 8px 20px rgba(15,76,168,0.12);
    }

    .topbar h1{
      font-size: clamp(28px, 3vw, 40px);
      margin-bottom:6px;
    }

    .topbar p{
      opacity:0.95;
      font-size:1rem;
    }

    .tab-container{
      position:sticky;
      top:0;
      z-index:20;
      display:flex;
      overflow-x:auto;
      gap:10px;
      padding:12px 18px;
      background:#1d5ec8;
      border-bottom:1px solid rgba(255,255,255,0.15);
      scrollbar-width:thin;
    }

    .tab-container::-webkit-scrollbar { height:8px; }
    .tab-container::-webkit-scrollbar-thumb{
      background: rgba(255,255,255,0.35);
      border-radius:10px;
    }

    .tab-btn{
      flex:0 0 auto;
      background:#edf5ff;
      color:#123d7d;
      border:none;
      border-radius:999px;
      padding:10px 16px;
      font-weight:700;
      cursor:pointer;
      transition:0.2s ease;
      box-shadow:0 2px 8px rgba(0,0,0,0.08);
    }

    .tab-btn.active{
      background:var(--accent);
      color:#123d10;
    }

    .tab-btn:hover{
      transform:translateY(-1px);
    }

    .container{
      max-width:1100px;
      margin:24px auto 60px;
      padding:0 14px;
    }

    .unit-page{
      display:none;
      background:var(--card);
      border-radius:20px;
      box-shadow:0 12px 34px rgba(17,24,39,0.07);
      padding:28px 24px 34px;
      animation: fadeIn 0.25s ease;
    }

    .unit-page.active{
      display:block;
    }

    @keyframes fadeIn{
      from { opacity:0; transform:translateY(8px); }
      to { opacity:1; transform:translateY(0); }
    }

    .unit-title{
      font-size: clamp(28px, 2.5vw, 36px);
      color: var(--danger);
      border-bottom: 3px solid var(--danger);
      padding-bottom:10px;
      margin-bottom:20px;
    }

    h3{
      font-size:1.3rem;
      margin-top:22px;
      margin-bottom:10px;
      color:var(--primary-dark);
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:10px;
      background:white;
    }

    th, td{
      border:1px solid var(--border);
      padding:12px 10px;
      text-align:left;
      vertical-align:top;
    }

    th{
      background:var(--soft-blue);
      color:var(--primary-dark);
      font-weight:700;
    }

    .box{
      border:1px solid var(--border);
      border-radius:14px;
      overflow:hidden;
      margin-top:14px;
    }

    .korean-box{
      background: var(--soft-blue);
      color: var(--primary);
      padding:18px 16px;
      border-bottom:1px solid var(--border);
      font-weight:700;
    }

    .bangla-box{
      background: var(--soft-yellow);
      color:#2c2c2c;
      padding:18px 16px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
      gap:16px;
      margin-top:16px;
    }

    .card{
      background:#f9fbff;
      border:1px solid var(--border);
      border-radius:12px;
      padding:14px 16px;
    }

    .card strong{
      display:block;
      margin-bottom:6px;
      color: var(--primary);
    }

    .note{
      margin-top:16px;
      padding:12px 14px;
      border-radius:8px;
      background:#edf5ff;
      border-left:4px solid var(--primary);
      color:#1d3557;
    }

    .highlight{
      margin-top:16px;
      padding:12px 14px;
      border-radius:10px;
      border:1px solid #efdca4;
      background:#fff7d6;
      color:#6b4d00;
      font-weight:700;
    }

    @media (max-width:700px){
      .unit-page{
        padding:20px 16px 28px;
      }
      .tab-btn{
        padding:9px 14px;
      }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <h1>KIIP 4급 (কোরিয়ান ভাষা ও সংস্কৃতি)</h1>
    <p>কোরিয়ান ভাষা ও বাংলার অর্থসহ সম্পূর্ণ বই</p>
  </header>

  <div class="tab-container" id="tabContainer"></div>

  <div class="container" id="contentContainer"></div>

          bn:'আমি কোরিয়ায় এসে ১ বছর হয়েছে। প্রথমে কোরিয়ান খাবার আমার মুখে লাগত না বলে কষ্ট হতো। কিন্তু এখন আমি কোরিয়ান জীবনে অনেকটা খাপ খাইয়ে নিয়েছি, তাই একা লাগে না।'

          bn:'এই পড়াশোনার মাধ্যমে কোরিয়ান ভাষার দক্ষতা অনেক বাড়িয়ে তুলেছি। প্রতিদিন সামান্য করে শিখে ও পুনরালোচনা করে দক্ষতা আরও বাড়াতে চাই।'

          ['배운 내용을 정리합니다.','আমি শিখে নেয়া বিষয়গুলো সাজিয়ে রাখি।']
        ]
      }
    ];

    const tabContainer = document.getElementById('tabContainer');
    const contentContainer = document.getElementById('contentContainer');

    function renderTabs(){
      tabContainer.innerHTML = units.map((unit, index) => `
        <button class="tab-btn ${index === 0 ? 'active' : ''}" onclick="openUnit('${unit.id}', this)">
          Unit ${index + 1}
        </button>
      `).join('');
    }

    function renderUnit(unitId){
      const unit = units.find(u => u.id === unitId);
      if (!unit) return;

      contentContainer.innerHTML = `
        <div class="unit-page active">
          <h2 class="unit-title">${unit.title}</h2>
          <p style="color: var(--muted); font-size: 1.04rem;"><strong>বাংলা:</strong> ${unit.subtitle}</p>

          <h3>1. 주요 어휘</h3>
          <table>
            <tr><th>কোরিয়ান</th><th>বাংলা অর্থ</th></tr>
            ${unit.vocab.map(([ko, bn]) => `
              <tr><td>${ko}</td><td>${bn}</td></tr>
            `).join('')}
          </table>

          <h3>2. 본문</h3>
          <div class="box">
            <div class="korean-box">${unit.passage.ko}</div>
            <div class="bangla-box">${unit.passage.bn}</div>
          </div>

          <h3>3. 쉬운 예문</h3>
          <div class="grid">
            ${unit.examples.map(([ko, bn]) => `
              <div class="card">
                <strong>한국어</strong>${ko}
                <br><br>
                <strong>বাংলা</strong>${bn}
              </div>
            `).join('')}
          </div>

          <div class="note">
            অনুশীলন: এই ইউনিটের ৩টি নতুন বাক্য নিজে তৈরি করো।
          </div>

          <div class="highlight">
            মূল শিক্ষা: ${unit.subtitle} সম্পর্কে বুঝতে পারলে ভাষা শেখা অনেক সহজ হয়ে যায়।
          </div>
        </div>
      `;
    }

    function openUnit(unitId, btn){
      const tabs = document.getElementsByClassName('tab-btn');
      for (let i = 0; i < tabs.length; i++) {
        tabs[i].classList.remove('active');
      }
      if (btn) btn.classList.add('active');

      renderUnit(unitId);
    }

    renderTabs();
    renderUnit('unit1');
  </script>
</body>
