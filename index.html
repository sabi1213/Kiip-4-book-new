  <script>
    const websiteUrl="https://sa01712256100-beep.github.io/Kiip-4-book-new/";
    // অধ্যায়গুলোর শিরোনাম KIIP Level 4 (한국어와 한국문화 중급 2)-এর ১৬টি বিষয়ের সঙ্গে মিলিয়ে সাজানো।
    const lessons=[
      {title:"한국 생활 적응",bnTitle:"কোরিয়ায় মানিয়ে নেওয়া",vocab:[["적응하다","মানিয়ে নেওয়া"],["낯설다","অচেনা লাগা"],["문화 차이","সাংস্কৃতিক পার্থক্য"],["예절","শিষ্টাচার"],["도움을 받다","সাহায্য পাওয়া"],["그리워하다","মিস করা"]],grammar:[["-(으)ㄴ/는 반면에","দুটি বিপরীত বিষয় তুলনা করতে: কোরিয়ার শীত ঠান্ডা, 반면에 বাংলাদেশের শীত তুলনামূলক উষ্ণ।"],["-기 때문에","কারণ বোঝাতে: 한국어가 익숙하지 않기 때문에 매일 연습해요. (কোরিয়ান ভাষায় অভ্যস্ত নই বলে প্রতিদিন অনুশীলন করি।)"]],ko:"저는 한국에 온 지 1년이 되었습니다. 처음에는 음식과 말이 낯설어서 실수를 많이 했습니다. 하지만 이웃들이 친절하게 도와주어서 지금은 한국 생활에 많이 적응했습니다. 가끔 고향이 그립지만 새로운 친구들과 즐겁게 지내고 있습니다.",bn:"কোরিয়ায় আসার এক বছর হয়েছে। প্রথমে খাবার ও ভাষা অচেনা লাগত বলে অনেক ভুল করতাম। কিন্তু প্রতিবেশীরা আন্তরিকভাবে সাহায্য করায় এখন কোরিয়ার জীবনে অনেকটা মানিয়ে নিয়েছি। মাঝে মাঝে নিজের শহরের কথা মনে পড়লেও নতুন বন্ধুদের সঙ্গে ভালো আছি।",practice:"নিজের নতুন পরিবেশে মানিয়ে নেওয়ার একটি অভিজ্ঞতা কোরিয়ান ভাষায় ৩টি বাক্যে লিখুন।"},
      {title:"가족의 변화",bnTitle:"পরিবারের পরিবর্তন",vocab:[["가족 형태","পরিবারের ধরন"],["핵가족","একক পরিবার"],["대가족","বড়/যৌথ পরিবার"],["맞벌이 부부","দুজনেই চাকরি করেন এমন দম্পতি"],["출산율","জন্মহার"],["세대 차이","প্রজন্মের ব্যবধান"]],grammar:[["-아/어지다","পরিবর্তিত হয়ে যাওয়া: 가족의 모습이 다양해졌어요. (পরিবারের ধরন বৈচিত্র্যময় হয়েছে।)"],["-는 반면(에)","দুই দিকের পার্থক্য বোঝাতে: 가족이 작아지는 반면 혼자 사는 사람이 늘어요. (পরিবার ছোট হচ্ছে, অন্যদিকে একা থাকা মানুষ বাড়ছে।)"]],ko:"요즘은 가족의 모습이 예전과 많이 달라졌습니다. 맞벌이 부부와 1인 가구가 늘고, 가족이 함께 보내는 시간은 줄어들기도 합니다. 가족의 형태가 달라도 서로 존중하고 대화하는 것이 중요합니다.",bn:"আজকাল পরিবারের ধরন আগের তুলনায় অনেক বদলেছে। দুজনেই চাকরি করেন এমন দম্পতি ও একা থাকা মানুষের সংখ্যা বাড়ছে, আর পরিবারের সঙ্গে কাটানো সময় কখনও কমে যাচ্ছে। পরিবারের ধরন ভিন্ন হলেও পরস্পরকে সম্মান ও কথা বলা গুরুত্বপূর্ণ।",practice:"আপনার দেশের পরিবারে কী পরিবর্তন হয়েছে তা কোরিয়ান ভাষায় কয়েকটি বাক্যে লিখুন।"},
      {title:"생활 속의 과학",bnTitle:"দৈনন্দিন জীবনে বিজ্ঞান",vocab:[["과학 기술","বিজ্ঞান ও প্রযুক্তি"],["발명","আবিষ্কার"],["작동하다","কাজ করা/চালু হওয়া"],["편리하다","সুবিধাজনক"],["원리","নীতি/কার্যপ্রণালি"],["생활용품","দৈনন্দিন ব্যবহার্য জিনিস"]],grammar:[["-에 의해(서)","কোনো কিছুর মাধ্যমে/দ্বারা: 전기는 발전소에 의해 공급돼요. (বিদ্যুৎ কেন্দ্রের মাধ্যমে বিদ্যুৎ সরবরাহ হয়।)"],["-(으)ㄹ수록","যত বেশি…তত বেশি: 과학이 발전할수록 생활이 편리해져요. (বিজ্ঞান যত উন্নত হচ্ছে, জীবন তত সুবিধাজনক হচ্ছে।)"]],ko:"과학 기술은 우리 생활을 편리하게 바꾸고 있습니다. 냉장고는 음식을 오래 보관하게 해 주고, 세탁기는 빨래하는 시간을 줄여 줍니다. 새로운 기술을 사용할 때는 편리함뿐 아니라 안전과 올바른 사용법도 알아야 합니다.",bn:"বিজ্ঞান ও প্রযুক্তি আমাদের জীবনকে সুবিধাজনক করে তুলছে। ফ্রিজ খাবার দীর্ঘ সময় সংরক্ষণ করে, আর ওয়াশিং মেশিন কাপড় ধোয়ার সময় কমায়। নতুন প্রযুক্তি ব্যবহারের সময় সুবিধার পাশাপাশি নিরাপত্তা ও সঠিক ব্যবহারবিধিও জানতে হয়।",practice:"আপনার দৈনন্দিন জীবনে কাজে লাগে এমন একটি যন্ত্রের কাজ ব্যাখ্যা করুন।"},
      {title:"한국의 의례",bnTitle:"কোরিয়ার আচার-অনুষ্ঠান",vocab:[["의례","আচার-অনুষ্ঠান"],["전통","ঐতিহ্য"],["결혼식","বিয়ের অনুষ্ঠান"],["장례식","শেষকৃত্য/অন্ত্যেষ্টিক্রিয়া"],["환갑","ষাট বছর পূর্তি"],["예를 갖추다","শিষ্টাচার পালন করা"]],grammar:[["-(으)ㄹ 때","কোনো সময় বোঝাতে: 결혼식에 갈 때 예의를 지켜요. (বিয়েতে গেলে শিষ্টাচার মানি।)"],["-도록 하다","কোনো কাজ করতে নির্দেশ/উদ্দেশ্য: 어른께 두 손으로 물건을 드리도록 해요. (বড়দের দুই হাতে জিনিস দেওয়ার চেষ্টা করি।)"]],ko:"한국에는 결혼식, 장례식, 돌잔치와 환갑처럼 중요한 의례가 있습니다. 의례의 모습은 시대에 따라 달라지지만 어른을 공경하고 가족의 기쁨과 슬픔을 함께 나누는 마음은 여전히 중요합니다.",bn:"কোরিয়ায় বিয়ে, অন্ত্যেষ্টিক্রিয়া, শিশুর প্রথম জন্মদিন এবং ষাট বছর পূর্তির মতো গুরুত্বপূর্ণ অনুষ্ঠান আছে। সময়ের সঙ্গে এসব অনুষ্ঠানের ধরন বদলালেও বড়দের সম্মান করা এবং পরিবারের আনন্দ-দুঃখ ভাগ করে নেওয়ার মনোভাব এখনও গুরুত্বপূর্ণ।",practice:"আপনার দেশের একটি গুরুত্বপূর্ণ পারিবারিক অনুষ্ঠানের রীতি বর্ণনা করুন।"},
      {title:"문화유산",bnTitle:"সাংস্কৃতিক ঐতিহ্য",vocab:[["문화유산","সাংস্কৃতিক ঐতিহ্য"],["유적","ঐতিহাসিক নিদর্শন"],["보존하다","সংরক্ষণ করা"],["유네스코","ইউনেস্কো"],["무형문화재","অমূর্ত সাংস্কৃতিক ঐতিহ্য"],["전승하다","প্রজন্মে প্রজন্মে চালু রাখা"]],grammar:[["-아/어 오다","অতীত থেকে বর্তমান পর্যন্ত চলা: 이 전통은 오래전부터 이어져 왔어요. (এই ঐতিহ্য বহু আগে থেকে চলে আসছে।)"],["-(으)ㄴ/는 것으로 알려져 있다","হিসেবে পরিচিত: 불국사는 아름다운 문화유산으로 알려져 있어요. (বুলগুকসা সুন্দর ঐতিহ্য হিসেবে পরিচিত।)"]],ko:"문화유산은 한 사회가 오랫동안 만들어 온 소중한 자산입니다. 궁궐과 오래된 건축물 같은 유형 유산뿐 아니라 음악과 전통 기술 같은 무형 유산도 있습니다. 문화유산을 잘 보존하고 다음 세대에 전하는 것은 모두의 책임입니다.",bn:"সাংস্কৃতিক ঐতিহ্য হলো কোনো সমাজের দীর্ঘদিনের সৃষ্টি করা মূল্যবান সম্পদ। প্রাসাদ ও পুরোনো স্থাপনার মতো বস্তুগত ঐতিহ্যের পাশাপাশি সংগীত ও ঐতিহ্যবাহী দক্ষতার মতো অমূর্ত ঐতিহ্যও আছে। এগুলো সংরক্ষণ করে পরবর্তী প্রজন্মকে জানানো সবার দায়িত্ব।",practice:"আপনার দেশের একটি সাংস্কৃতিক ঐতিহ্য পরিচয় করিয়ে দিন।"},
      {title:"국제화 시대",bnTitle:"বিশ্বায়নের যুগ",vocab:[["국제화","আন্তর্জাতিকীকরণ"],["교류","বিনিময়"],["다문화 사회","বহুসাংস্কৃতিক সমাজ"],["무역","বাণিজ্য"],["외국인","বিদেশি ব্যক্তি"],["편견","পূর্বধারণা"]],grammar:[["-에 따라(서)","অনুযায়ী: 문화에 따라 인사하는 방법이 달라요. (সংস্কৃতি অনুযায়ী অভিবাদনের পদ্ধতি আলাদা।)"],["-는 데 도움이 되다","কোনো কাজে সহায়ক: 외국어 공부는 다른 문화를 이해하는 데 도움이 돼요. (বিদেশি ভাষা শেখা অন্য সংস্কৃতি বুঝতে সাহায্য করে।)"]],ko:"교통과 통신이 발달하면서 여러 나라 사람들이 더 자주 교류하게 되었습니다. 국제화는 새로운 문화를 배우고 경제를 발전시키는 기회가 됩니다. 서로 다른 문화를 존중하고 편견 없이 소통하는 태도가 필요합니다.",bn:"যাতায়াত ও যোগাযোগব্যবস্থার উন্নতির ফলে বিভিন্ন দেশের মানুষ এখন আরও বেশি যোগাযোগ করছে। বিশ্বায়ন নতুন সংস্কৃতি শেখা ও অর্থনীতি উন্নত করার সুযোগ দেয়। ভিন্ন সংস্কৃতিকে সম্মান করা এবং পূর্বধারণা ছাড়াই যোগাযোগ করা প্রয়োজন।",practice:"আন্তর্জাতিক যোগাযোগের একটি সুবিধা ও একটি চ্যালেঞ্জ লিখুন।"},
      {title:"현대인의 질병",bnTitle:"আধুনিক মানুষের রোগব্যাধি",vocab:[["질병","রোগ"],["증상","উপসর্গ"],["스트레스","মানসিক চাপ"],["만성 질환","দীর্ঘস্থায়ী রোগ"],["예방하다","প্রতিরোধ করা"],["생활 습관","জীবনযাপনের অভ্যাস"]],grammar:[["-지 않도록","যেন না ঘটে: 병에 걸리지 않도록 손을 자주 씻어요. (অসুস্থ না হতে ঘন ঘন হাত ধুই।)"],["-는 것이 좋다","করা ভালো: 규칙적으로 운동하는 것이 좋아요. (নিয়মিত ব্যায়াম করা ভালো।)"]],ko:"현대인은 스트레스와 운동 부족 때문에 여러 질병을 겪을 수 있습니다. 건강을 지키려면 균형 잡힌 식사를 하고 충분히 자며 규칙적으로 운동해야 합니다. 증상이 오래 계속되면 혼자 판단하지 말고 의료기관에서 진료를 받아야 합니다.",bn:"মানসিক চাপ ও ব্যায়ামের অভাবে আধুনিক মানুষ বিভিন্ন রোগে ভুগতে পারে। সুস্থ থাকতে সুষম খাবার খাওয়া, পর্যাপ্ত ঘুম এবং নিয়মিত ব্যায়াম দরকার। উপসর্গ দীর্ঘদিন থাকলে নিজে নিজে সিদ্ধান্ত না নিয়ে চিকিৎসাকেন্দ্রে পরামর্শ নেওয়া উচিত।",practice:"সুস্থ থাকার জন্য আপনি যে তিনটি অভ্যাস অনুসরণ করেন তা লিখুন।"},
      {title:"정보화 사회",bnTitle:"তথ্যপ্রযুক্তিনির্ভর সমাজ",vocab:[["정보화 사회","তথ্যপ্রযুক্তিনির্ভর সমাজ"],["인터넷","ইন্টারনেট"],["개인 정보","ব্যক্তিগত তথ্য"],["검색하다","খোঁজা"],["가짜 뉴스","ভুয়া খবর"],["보안","নিরাপত্তা"]],grammar:[["-는 바람에","অপ্রত্যাশিত নেতিবাচক কারণে: 비밀번호를 잊어버리는 바람에 계정에 들어가지 못했어요. (পাসওয়ার্ড ভুলে যাওয়ায় অ্যাকাউন্টে ঢুকতে পারিনি।)"],["-(으)ㄴ/는지 확인하다","কী/কি না যাচাই করা: 정보가 정확한지 확인해야 해요. (তথ্য সঠিক কি না যাচাই করতে হবে।)"]],ko:"인터넷과 스마트폰 덕분에 필요한 정보를 빠르게 찾고 사람들과 쉽게 연락할 수 있습니다. 하지만 개인 정보가 유출되거나 가짜 뉴스가 퍼질 위험도 있습니다. 출처를 확인하고 비밀번호를 안전하게 관리하는 습관이 중요합니다.",bn:"ইন্টারনেট ও স্মার্টফোনের কারণে প্রয়োজনীয় তথ্য দ্রুত পাওয়া এবং মানুষের সঙ্গে সহজে যোগাযোগ করা যায়। তবে ব্যক্তিগত তথ্য ফাঁস বা ভুয়া খবর ছড়িয়ে পড়ার ঝুঁকিও আছে। তথ্যের উৎস যাচাই এবং পাসওয়ার্ড নিরাপদে রাখা জরুরি।",practice:"ইন্টারনেট নিরাপদে ব্যবহারের দুটি নিয়ম লিখুন।"},
      {title:"사건과 사고",bnTitle:"ঘটনা ও দুর্ঘটনা",vocab:[["사건","ঘটনা/অপরাধমূলক ঘটনা"],["사고","দুর্ঘটনা"],["목격자","প্রত্যক্ষদর্শী"],["신고하다","জানানো/রিপোর্ট করা"],["피해자","ক্ষতিগ্রস্ত ব্যক্তি"],["응급 상황","জরুরি অবস্থা"]],grammar:[["-는 중이다","কাজ চলমান: 경찰이 사고 원인을 조사하는 중이에요. (পুলিশ দুর্ঘটনার কারণ তদন্ত করছে।)"],["-자마자","কাজ শেষ হওয়ার সঙ্গে সঙ্গে: 사고를 보자마자 신고했어요. (দুর্ঘটনা দেখামাত্র রিপোর্ট করেছি।)"]],ko:"길에서 사고를 목격하면 먼저 자신의 안전을 확인해야 합니다. 사람이 다쳤다면 긴급 전화로 신고하고, 장소와 상황을 정확히 설명합니다. 확인되지 않은 소문이나 피해자의 개인정보를 인터넷에 올리지 않는 것도 중요합니다.",bn:"রাস্তায় দুর্ঘটনা দেখলে আগে নিজের নিরাপত্তা নিশ্চিত করতে হবে। কেউ আহত হলে জরুরি নম্বরে জানিয়ে স্থান ও পরিস্থিতি পরিষ্কারভাবে বলতে হবে। যাচাই না করা গুজব বা ক্ষতিগ্রস্ত ব্যক্তির ব্যক্তিগত তথ্য ইন্টারনেটে না ছড়ানোও জরুরি।",practice:"জরুরি অবস্থায় কীভাবে সাহায্য চাইবেন, একটি ছোট সংলাপ লিখুন।"},
      {title:"언어생활",bnTitle:"ভাষার ব্যবহার ও দৈনন্দিন যোগাযোগ",vocab:[["언어생활","ভাষার ব্যবহার"],["표현","প্রকাশভঙ্গি"],["존댓말","সম্মানসূচক ভাষা"],["반말","অনানুষ্ঠানিক ভাষা"],["상황","পরিস্থিতি"],["오해하다","ভুল বোঝা"]],grammar:[["-(으)ㄹ까요?","প্রস্তাব বা মতামত জানতে: 같이 이야기해 볼까요? (একসঙ্গে কথা বলে দেখব?)"],["-다고 들었다","শোনা তথ্য জানাতে: 그분은 한국어를 잘한다고 들었어요. (শুনেছি তিনি কোরিয়ান ভালো বলেন।)"]],ko:"상대방과 상황에 맞는 말을 사용하는 것은 원활한 의사소통에 중요합니다. 처음 만난 사람이나 어른에게는 존댓말을 쓰는 것이 좋습니다. 말투와 표정이 다르면 같은 말도 다르게 들릴 수 있으므로 상대방의 말을 잘 듣고 확인해야 합니다.",bn:"কথার সঙ্গী ও পরিস্থিতি অনুযায়ী ভাষা ব্যবহার করা ভালো যোগাযোগের জন্য গুরুত্বপূর্ণ। প্রথমবার দেখা ব্যক্তি বা বড়দের সঙ্গে সম্মানসূচক ভাষা ব্যবহার করা ভালো। কথার ভঙ্গি ও মুখের অভিব্যক্তির কারণে একই কথা ভিন্নভাবে বোঝা যেতে পারে, তাই মন দিয়ে শুনে নিশ্চিত হওয়া দরকার।",practice:"বন্ধু ও শিক্ষকের সঙ্গে কথা বলার ভাষার পার্থক্য উদাহরণসহ লিখুন।"},
      {title:"교육 제도",bnTitle:"শিক্ষাব্যবস্থা",vocab:[["교육 제도","শিক্ষাব্যবস্থা"],["초등학교","প্রাথমিক বিদ্যালয়"],["중학교","মাধ্যমিক বিদ্যালয়"],["고등학교","উচ্চ বিদ্যালয়"],["진학하다","পরবর্তী স্তরে পড়তে যাওয়া"],["평생 교육","আজীবন শিক্ষা"]],grammar:[["-기 위해(서)","উদ্দেশ্য বোঝাতে: 대학에 진학하기 위해 열심히 공부해요. (বিশ্ববিদ্যালয়ে পড়তে যাওয়ার জন্য মন দিয়ে পড়ি।)"],["-뿐만 아니라","শুধু তা-ই নয়, আরও: 학교에서는 지식뿐만 아니라 사회성도 배워요. (স্কুলে জ্ঞানের পাশাপাশি সামাজিক দক্ষতাও শেখা হয়।)"]],ko:"교육은 지식과 기술을 배우고 사회 구성원으로 성장하는 과정입니다. 한국에는 초등학교, 중학교, 고등학교와 대학교가 있으며 성인이 된 후에도 다양한 평생 교육을 받을 수 있습니다. 자신의 목표와 적성에 맞는 학습 계획을 세우는 것이 중요합니다.",bn:"শিক্ষা হলো জ্ঞান ও দক্ষতা শেখা এবং সমাজের সদস্য হিসেবে বেড়ে ওঠার প্রক্রিয়া। কোরিয়ায় প্রাথমিক, মাধ্যমিক, উচ্চ বিদ্যালয় ও বিশ্ববিদ্যালয় আছে; প্রাপ্তবয়স্ক হওয়ার পরও নানা ধরনের আজীবন শিক্ষা নেওয়া যায়। নিজের লক্ষ্য ও যোগ্যতা অনুযায়ী পড়ার পরিকল্পনা করা গুরুত্বপূর্ণ।",practice:"আপনার দেশের শিক্ষার ধাপগুলো কোরিয়ান ভাষায় সংক্ষেপে বর্ণনা করুন।"},
      {title:"선거와 투표",bnTitle:"নির্বাচন ও ভোটদান",vocab:[["선거","নির্বাচন"],["투표하다","ভোট দেওয়া"],["후보자","প্রার্থী"],["공약","নির্বাচনী প্রতিশ্রুতি"],["유권자","ভোটার"],["민주주의","গণতন্ত্র"]],grammar:[["-(으)ㄹ 권리가 있다","অধিকার থাকা: 국민은 투표할 권리가 있어요. (নাগরিকদের ভোট দেওয়ার অধিকার আছে।)"],["-에 대해(서)","সম্পর্কে: 후보자의 공약에 대해 알아봤어요. (প্রার্থীর প্রতিশ্রুতি সম্পর্কে জেনেছি।)"]],ko:"선거는 시민이 대표자를 선택하는 민주적인 방법입니다. 유권자는 후보자의 정책과 공약을 살펴보고 자신의 판단에 따라 투표합니다. 투표할 때는 정확한 정보를 확인하고 다른 사람의 선택도 존중해야 합니다.",bn:"নির্বাচন হলো নাগরিকদের প্রতিনিধি বেছে নেওয়ার গণতান্ত্রিক পদ্ধতি। ভোটাররা প্রার্থীর নীতি ও প্রতিশ্রুতি দেখে নিজের বিবেচনায় ভোট দেন। ভোট দেওয়ার সময় নির্ভরযোগ্য তথ্য যাচাই করা এবং অন্যের পছন্দকে সম্মান করা উচিত।",practice:"একজন প্রার্থী বাছাই করার সময় কোন বিষয়গুলো বিবেচনা করবেন?"},
      {title:"환경 보호",bnTitle:"পরিবেশ সুরক্ষা",vocab:[["환경 오염","পরিবেশ দূষণ"],["분리수거","বর্জ্য আলাদা করা"],["재활용","পুনর্ব্যবহার"],["일회용품","একবার ব্যবহারযোগ্য জিনিস"],["에너지 절약","শক্তি সাশ্রয়"],["대중교통","গণপরিবহন"]],grammar:[["-기 위해(서)","উদ্দেশ্য বোঝাতে: 쓰레기를 줄이기 위해 재사용 용기를 써요. (বর্জ্য কমাতে পুনর্ব্যবহারযোগ্য পাত্র ব্যবহার করি।)"],["-도록 노력하다","কোনো কাজের চেষ্টা করা: 전기를 아끼도록 노력해요. (বিদ্যুৎ সাশ্রয়ের চেষ্টা করি।)"]],ko:"환경 오염을 줄이려면 생활 속에서 실천하는 것이 중요합니다. 쓰레기를 종류별로 분리하고 일회용품 사용을 줄일 수 있습니다. 가까운 거리는 걷거나 대중교통을 이용하고, 사용하지 않는 전등을 끄는 것도 좋은 방법입니다.",bn:"পরিবেশ দূষণ কমাতে দৈনন্দিন জীবনে কাজ করা গুরুত্বপূর্ণ। আবর্জনা ধরন অনুযায়ী আলাদা করা এবং একবার ব্যবহারযোগ্য জিনিস কমানো যায়। কাছের জায়গায় হেঁটে বা গণপরিবহনে যাওয়া এবং অপ্রয়োজনীয় বাতি বন্ধ করাও ভালো উপায়।",practice:"পরিবেশ রক্ষায় আপনার পরিবার একসঙ্গে করতে পারে এমন তিনটি কাজ লিখুন।"},
      {title:"생활과 경제",bnTitle:"দৈনন্দিন জীবন ও অর্থনীতি",vocab:[["경제 활동","অর্থনৈতিক কর্মকাণ্ড"],["수입","আয়"],["지출","ব্যয়"],["저축하다","সঞ্চয় করা"],["소비하다","খরচ/ভোগ করা"],["물가","দ্রব্যমূল্য"]],grammar:[["-는 데(에) 돈이 들다","কোনো কাজে টাকা লাগা: 집을 관리하는 데 돈이 들어요. (বাড়ির রক্ষণাবেক্ষণে টাকা লাগে।)"],["-(으)ㄹ 계획이다","পরিকল্পনা বোঝাতে: 매달 일정한 금액을 저축할 계획이에요. (প্রতি মাসে নির্দিষ্ট টাকা সঞ্চয়ের পরিকল্পনা আছে।)"]],ko:"안정적인 생활을 하려면 수입과 지출을 잘 관리해야 합니다. 먼저 한 달 예산을 세우고 꼭 필요한 물건부터 구매합니다. 갑자기 필요한 비용에 대비해 조금씩 저축하고 계약이나 금융 상품의 조건도 꼼꼼히 확인해야 합니다.",bn:"স্থিতিশীল জীবনযাপনের জন্য আয় ও ব্যয় ভালোভাবে সামলাতে হয়। আগে মাসিক বাজেট তৈরি করে প্রয়োজনীয় জিনিস আগে কিনি। হঠাৎ দরকারি খরচের জন্য অল্প অল্প সঞ্চয় করি এবং চুক্তি বা আর্থিক পণ্যের শর্ত ভালোভাবে যাচাই করি।",practice:"একটি সহজ মাসিক বাজেটের খাতগুলো লিখুন।"},
      {title:"법과 질서",bnTitle:"আইন ও শৃঙ্খলা",vocab:[["법률","আইন"],["질서","শৃঙ্খলা"],["권리","অধিকার"],["의무","কর্তব্য"],["규칙을 지키다","নিয়ম মানা"],["신고하다","অভিযোগ/রিপোর্ট করা"]],grammar:[["-아/어서는 안 되다","করা যাবে না: 다른 사람의 권리를 침해해서는 안 돼요. (অন্যের অধিকার লঙ্ঘন করা যাবে না।)"],["-(으)ㄹ 의무가 있다","কর্তব্য থাকা: 시민은 법을 지킬 의무가 있어요. (নাগরিকদের আইন মানার কর্তব্য আছে।)"]],ko:"법과 질서는 모든 사람이 안전하게 함께 살아가기 위해 필요합니다. 사람들은 법이 정한 권리와 의무를 알고 규칙을 지켜야 합니다. 문제가 생기거나 권리가 침해되면 관련 기관에 문의하고 정해진 절차에 따라 도움을 받을 수 있습니다.",bn:"সবাইকে নিরাপদে একসঙ্গে বসবাস করতে আইন ও শৃঙ্খলা প্রয়োজন। মানুষের আইনসম্মত অধিকার ও কর্তব্য জানা এবং নিয়ম মানা উচিত। সমস্যা হলে বা অধিকার ক্ষুণ্ণ হলে সংশ্লিষ্ট প্রতিষ্ঠানে যোগাযোগ করে নির্ধারিত পদ্ধতিতে সাহায্য নেওয়া যায়।",practice:"দৈনন্দিন জীবনে মানা জরুরি এমন একটি নিয়ম এবং তার কারণ লিখুন।"},
      {title:"이민 생활",bnTitle:"অভিবাসী জীবন",vocab:[["이민","অভিবাসন"],["정착하다","স্থায়ীভাবে বসতি গড়া"],["체류 자격","থাকার অনুমতি/ভিসার ধরন"],["한국어 능력","কোরিয়ান ভাষার দক্ষতা"],["지역 사회","স্থানীয় সমাজ"],["지원 기관","সহায়তা সংস্থা"]],grammar:[["-게 되다","পরিস্থিতিতে পরিবর্তন/নতুন অবস্থা: 한국에서 일하게 되었어요. (কোরিয়ায় কাজ করার সুযোগ হয়েছে।)"],["-는 동안","সময়ের মধ্যে: 한국에 사는 동안 여러 제도를 배웠어요. (কোরিয়ায় থাকার সময়ে বিভিন্ন ব্যবস্থা শিখেছি।)"]],ko:"새로운 나라에서 생활을 시작하면 언어와 문화, 행정 절차가 낯설 수 있습니다. 필요한 체류 정보를 확인하고 한국어를 꾸준히 배우며 지역 사회 활동에도 참여하면 정착에 도움이 됩니다. 어려움이 있을 때는 가족이나 지역 지원 기관에 도움을 요청할 수 있습니다.",bn:"নতুন দেশে জীবন শুরু করলে ভাষা, সংস্কৃতি ও প্রশাসনিক প্রক্রিয়া অচেনা লাগতে পারে। থাকার অনুমতির প্রয়োজনীয় তথ্য জেনে, নিয়মিত কোরিয়ান শিখে এবং স্থানীয় সমাজের কাজে অংশ নিলে মানিয়ে নিতে সুবিধা হয়। সমস্যা হলে পরিবার বা স্থানীয় সহায়তা সংস্থার কাছে সাহায্য চাওয়া যায়।",practice:"নতুন দেশে বসবাস শুরু করা কাউকে আপনি কী তিনটি পরামর্শ দেবেন?"}
    ];
    const tabs=document.getElementById("tabs"),content=document.getElementById("content");
    function renderBook(){lessons.forEach((lesson,index)=>{const button=document.createElement("button");button.className="tab-btn"+(index===0?" active":"");button.type="button";button.textContent="অধ্যায় "+(index+1);button.setAttribute("role","tab");button.setAttribute("aria-selected",index===0?"true":"false");button.addEventListener("click",()=>openLesson(index));tabs.appendChild(button);
      const page=document.createElement("article");page.className="unit-page"+(index===0?" active":"");page.id="lesson-"+(index+1);page.innerHTML=`<h2>অধ্যায় ${index+1}: ${lesson.title}</h2><p class="subtitle"><strong>বাংলা:</strong> ${lesson.bnTitle}</p><h3>১. 주요 어휘 — গুরুত্বপূর্ণ শব্দ</h3><table><thead><tr><th>কোরিয়ান</th><th>বাংলা অর্থ</th></tr></thead><tbody>${lesson.vocab.map(([ko,bn])=>`<tr><td lang="ko">${ko}</td><td>${bn}</td></tr>`).join("")}</tbody></table><h3>২. 주요 문법 — ব্যাকরণ ও উদাহরণ</h3>${lesson.grammar.map(([form,explanation])=>`<div class="grammar"><strong>${form}</strong><br>${explanation}</div>`).join("")}<h3>৩. 본문 — কোরিয়ান পাঠ ও বাংলা অনুবাদ</h3><div class="passage"><div class="ko" lang="ko">${lesson.ko}</div><div class="bn">${lesson.bn}</div></div><div class="practice"><strong>অনুশীলন:</strong> ${lesson.practice}</div>`;content.appendChild(page);});}
    function openLesson(index){document.querySelectorAll(".unit-page").forEach((page,i)=>page.classList.toggle("active",i===index));document.querySelectorAll(".tab-btn").forEach((button,i)=>{button.classList.toggle("active",i===index);button.setAttribute("aria-selected",i===index?"true":"false");});}
    renderBook();window.addEventListener("load",()=>{const target=document.getElementById("qrcode");if(window.QRCode){new QRCode(target,{text:websiteUrl,width:100,height:100,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});}else{target.innerHTML='<a href="'+websiteUrl+'">ওয়েবসাইট খুলুন</a>';}});
  </script>
