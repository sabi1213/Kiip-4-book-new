    const tabs = document.getElementById("tabs");
    const content = document.getElementById("content");

    function renderBook() {
      lessons.forEach((lesson, index) => {
        const button = document.createElement("button");
        button.className = "tab-btn" + (index === 0 ? " active" : "");
        button.type = "button";
        button.textContent = "অধ্যায় " + (index + 1);
        button.setAttribute("role", "tab");
        button.setAttribute("aria-selected", index === 0 ? "true" : "false");
        button.addEventListener("click", () => openLesson(index));
        tabs.appendChild(button);

        const page = document.createElement("article");
        page.className = "unit-page" + (index === 0 ? " active" : "");
        page.id = "lesson-" + (index + 1);
        page.innerHTML = `
          <h2>অধ্যায় ${index + 1}: ${lesson.title}</h2>
          <p class="subtitle"><strong>বাংলা:</strong> ${lesson.bnTitle}</p>
          <h3>১. 주요 어휘 — গুরুত্বপূর্ণ শব্দ</h3>
          <table><thead><tr><th>কোরিয়ান</th><th>বাংলা অর্থ</th></tr></thead><tbody>
            ${lesson.vocab.map(([ko,bn]) => `<tr><td lang="ko">${ko}</td><td>${bn}</td></tr>`).join("")}
          </tbody></table>
          <h3>২. 주요 문법 — গুরুত্বপূর্ণ ব্যাকরণ</h3>
          ${lesson.grammar.map(([form,explanation]) => `<div class="grammar"><strong>${form}</strong><br>${explanation}</div>`).join("")}
          <h3>৩. 본문 — মূল পাঠ</h3>
          <div class="passage"><div class="ko" lang="ko">${lesson.ko}</div><div class="bn">${lesson.bn}</div></div>
          <div class="practice"><strong>অনুশীলন:</strong> ${lesson.practice}</div>`;
        content.appendChild(page);
      });
    }

    function openLesson(index) {
      document.querySelectorAll(".unit-page").forEach((page, i) => page.classList.toggle("active", i === index));
      document.querySelectorAll(".tab-btn").forEach((button, i) => {
        button.classList.toggle("active", i === index);
        button.setAttribute("aria-selected", i === index ? "true" : "false");
      });
    }

    renderBook();
    window.addEventListener("load", () => {
      const target = document.getElementById("qrcode");
      if (window.QRCode) {
        new QRCode(target, { text: websiteUrl, width: 100, height: 100, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
      } else {
        target.innerHTML = '<a href="' + websiteUrl + '">ওয়েবসাইট খুলুন</a>';
      }
    });
  </script>
